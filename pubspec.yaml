name: cnattendance
description: An attendance application.
publish_to: 'none'
version: 1.0.9+10

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_translate: ^3.1.0
  provider: ^6.0.3
  http: ^1.2.0
  dio: ^5.1.2
  html: ^0.15.1
  flutter_svg: ^2.0.10+1
  shared_preferences: ^2.0.6
  flutter_easyloading: ^3.0.5

  # Compatible versions to resolve win32 conflicts
  device_info_plus: ^11.0.0
  geolocator: ^13.0.1
  expandable: ^5.0.1
  flutter_web_browser: ^0.17.3
  percent_indicator: ^4.0.1
  persistent_bottom_nav_bar_v2: ^6.3.2
  toggle_switch: ^2.0.1
  dropdown_button2: ^2.3.9
  lottie: ^3.1.2
  flutter_html: ^3.0.0-alpha.3
  url_launcher: ^6.1.5

  permission_handler: ^12.0.3
  table_calendar: ^3.0.6
  intl: 0.20.2
  image_picker: ^1.1.2
  network_info_plus: ^6.0.0
  firebase_core: ^4.10.0
  firebase_messaging: ^16.3.0
  firebase_database: ^12.4.2
  overlay_support: ^2.0.1
  flutter_ringtone_player: ^4.0.0+4
  hexcolor: ^3.0.1
  fl_chart: ^0.69.0
  overlay_loading_progress: ^1.0.0
  one_clock: ^2.0.1
  get: ^4.6.5
  wakelock_plus: ^1.2.8
  readmore: ^3.0.0
  image_stack: ^2.1.1
  in_app_notification: ^1.1.2
  gallery_image_viewer: ^1.2.0
  flutter_typeahead: ^6.0.0
  flutter_textfield_autocomplete: ^1.0.2
  path_provider: ^2.0.15
  path: ^1.8.3
  fluttertoast: ^9.1.0
  mobile_scanner: ^7.0.0
  flutter_mentions: ^2.0.1
  file_picker: ^8.1.0
  awesome_notifications: ^0.10.1
  flutter_local_notifications: ^19.4.2
  timezone: ^0.10.1
  nepali_english_calendar: ^1.0.1+1
  cupertino_icons: ^1.0.2
  font_awesome_flutter: ^11.0.0
  quick_actions: ^1.1.0
  nepali_date_picker: ^7.0.0
  focus_detector: ^2.0.1
  auto_size_text_field: ^2.2.4
  text_sizer_plus: ^1.0.5
  nfc_manager: ^4.1.1
  http_interceptor_plus: ^0.0.1
  uuid: ^4.3.3
  ripple_wave: ^0.1.5

  nepali_utils: any
  image: any
  flutter_background_service: ^5.0.9

dependency_overrides:
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.14.4
  change_app_package_name: any
  flutter_native_html_to_pdf: ^3.1.0
  share_plus: ^10.1.0
  cached_network_image: ^3.4.1
  get_storage: ^2.1.1
  flutter_displaymode: ^0.7.0
  ripple_wave: ^0.1.5
  nepali_utils: any
  image: any
  connectivity_plus: ^7.1.1
  flutter_background_service: ^5.0.9

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icons/launcher-icon.png"
  remove_alpha_ios: true
  min_sdk_android: 21

flutter:
  uses-material-design: true
  fonts:
    - family: GoogleSans
      fonts:
        - asset: assets/fonts/google_sans.ttf
  assets:
    - AssetManifest.json
    - assets/icons/
    - assets/images/
    - assets/sound/
    - assets/ca/
    - assets/raw/
    - assets/i18n/